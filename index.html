<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>QR List Scanner</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#dfa437">
  <link rel="icon" href="icon-192.png">
  <style>
    .sync-status { margin-left: 8px; font-weight: 700; font-size: 1rem; }
    .sync-status.ok { color: var(--accent); }
    .sync-status.already { color: #f59e0b; }
    .sync-status.err { color: var(--danger); }
    .sync-status.syncing { color: var(--muted); font-size: 0.8rem; }
    :root {
      --bg:#f4f6fa; --surface:#ffffff; --ink:#0a192f; --muted:#5c6b7e; --line:#d6deea; --accent:#dfa437; --accent-ink:#072b56; --danger:#b3261e;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark){
      :root:not([data-theme="light"]){
        --bg:#19233B; --surface:#0d3b6f; --ink:#f4f7fb; --muted:#94a8c4; --line:#1c497e; --accent:#dfa437; --accent-ink:#072b56; --danger:#ff8a80;
        color-scheme: dark;
      }
    }
    * {box-sizing:border-box;}
    html {scroll-padding-top:env(safe-area-inset-top,0px);}
    body {margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.4;}
    main {max-width:560px;margin:0 auto;padding:16px;}
    h1 {font-size:1.25rem;margin:4px 0 12px;}
    
    .cam {position:relative;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:1/1;border:1px solid var(--line);}
    .cam video {width:100%;height:100%;object-fit:cover;display:block;}
    .cam .hint {position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:#cfd8d2;padding:24px;font-size:.95rem;}
    .cam .frame {position:absolute;inset:18%;border:3px solid var(--accent);border-radius:12px;pointer-events:none;display:none;}
    .cam.on .frame {display:block;}
    .cam.on .hint {display:none;}
    
    /* NEW: Giant popping checkmark for kids */
    .cam.flash::after {
      content: '✔';
      position: absolute;
      inset: 0;
      background: rgba(46, 204, 113, 0.85);
      color: white;
      font-size: 8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      animation: pop 0.2s ease-out;
    }
    @keyframes pop {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .row {display:flex;gap:8px;margin:12px 0;flex-wrap:wrap;}
    button,label.btn {font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 14px;border-radius:10px;cursor:pointer;min-height:44px;}
    button.primary {background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600;flex:1;}
    button:focus-visible,label.btn:focus-visible,a:focus-visible {outline:3px solid var(--accent);outline-offset:2px;}
    .status {font-size:.9rem;color:var(--muted);min-height:1.3em;margin:0 0 8px;}
    .status.err {color:var(--danger);}
    .head {display:flex;align-items:baseline;justify-content:space-between;margin-top:20px;}
    .head h2 {font-size:1.05rem;margin:0;}
    .count {color:var(--muted);font-size:.9rem;}
    ul {list-style:none;margin:8px 0 0;padding:0;}
    li {background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start;}
    li .txt {flex:1;min-width:0;overflow-wrap:anywhere;}
    li .time {display:block;font-size:.78rem;color:var(--muted);margin-top:2px;}
    li a {color:var(--accent);}
    li button {min-height:36px;padding:6px 10px;font-size:.85rem;}
    .empty {color:var(--muted);padding:14px 0;}
    input[type=file] {display:none;}
    input[type=text] {font:inherit;flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 12px;border-radius:10px;min-height:44px;}
    input[type=text]:focus-visible {outline:3px solid var(--accent);outline-offset:2px;}
  </style>
</head>
<body>
<main>
  <h1>QR list scanner <small style="font-weight:400;font-size:.7rem;color:var(--muted)">v14</small></h1>

  <div class="cam" id="cam">
    <video id="video" playsinline muted></video>
    <div class="frame"></div>
    <div class="hint">Tap “Start camera”, then point it at a QR code.</div>
  </div>
  <div>
  <div class="row">
    <select id="sessionSelect" style="flex:1; min-height:44px; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font:inherit;">
      <option value="قداس">قداس</option>
      <option value="ألحان">ألحان</option>
      <option value="عشية">عشية</option>
    </select>
  </div>
  <div class="row">
    <button class="primary" id="toggle">Start camera</button>
    <button id="flip" hidden>Flip</button>
    <button id="torch" hidden>Flashlight</button>
    <label class="btn" for="pic">Scan a photo</label>
    <input type="file" id="pic" accept="image/*" capture="environment">
  </div>
  <p class="status" id="status" role="status"></p>
  <div class="row">
    <input type="text" id="manual" dir="auto" placeholder="Type a name (no QR code)" autocomplete="off" enterkeyhint="done" aria-label="Type a name">
    <button id="addManual">Add</button>
  </div>

  <div class="head">
    <h2>Scanned codes</h2>
    <span class="count" id="count">0</span>
  </div>
  <div class="row">
    <button id="copyAll">Copy all</button>
    <button id="clear">Clear list</button>
  </div>
  <ul id="list"></ul>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

<script>
(function(){
  var KEY = 'qr-list-v1';
  var items = [];
  var video = document.getElementById('video');
  var cam = document.getElementById('cam');
  var statusEl = document.getElementById('status');
  var listEl = document.getElementById('list');
  var countEl = document.getElementById('count');
  var toggleBtn = document.getElementById('toggle');
  var stream = null, running = false, lastText = '', lastTime = 0;
  var detector = null;
  var canvas = document.createElement('canvas');
  var ctx = canvas.getContext('2d', { willReadFrequently: true });

  try { if ('BarcodeDetector' in window) detector = new BarcodeDetector({ formats: ['qr_code'] }); } catch (e) { detector = null; }

  function load(){ try { items = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { items = []; } if (!Array.isArray(items)) items = []; }
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(items)); } catch (e) {} }
  function setStatus(msg, err){ statusEl.textContent = msg || ''; statusEl.className = 'status' + (err ? ' err' : ''); }
  function isUrl(s){ return /^https?:\/\/\S+$/i.test(s); }

  function render(){
    countEl.textContent = items.length;
    listEl.innerHTML = '';
    if (!items.length){
      var p = document.createElement('li');
      p.className = 'empty'; p.style.border = '0'; p.style.background = 'none'; p.style.padding = '14px 0';
      p.textContent = 'Nothing yet. Scanned codes will appear here.';
      listEl.appendChild(p); return;
    }
    items.forEach(function(it, i){
      var li = document.createElement('li');
      var box = document.createElement('div'); box.className = 'txt';
      if (isUrl(it.text)){
        var a = document.createElement('a'); a.href = it.text; a.target = '_blank'; a.rel = 'noopener noreferrer'; a.textContent = it.text; box.appendChild(a);
      } else { box.appendChild(document.createTextNode(it.text)); }
      if (it.b){
        var badge = document.createElement('span');
        badge.className = 'sync-status ' + (it.bc || '');
        badge.textContent = ' ' + it.b;
        box.appendChild(badge);
      }
      var t = document.createElement('span'); t.className = 'time'; t.textContent = new Date(it.t).toLocaleString() + (it.m ? ' (typed)' : ''); box.appendChild(t);
      var del = document.createElement('button'); del.textContent = 'Delete'; del.setAttribute('aria-label','Delete this entry');
      del.onclick = function(){ items.splice(i,1); save(); render(); };
      li.appendChild(box); li.appendChild(del); listEl.appendChild(li);
    });
  }
 
  window.setItemStatus = function(text, badgeText, cls){
    for (var i = 0; i < items.length; i++){
      if (items[i].text === text){ items[i].b = badgeText; items[i].bc = cls || ''; break; }
    }
    save(); render();
  };

  function playScanBeep() {
    try {
      var AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return;
      var ctx = new AudioContext();
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      
      osc.type = 'sine';
      osc.frequency.setValueAtTime(1500, ctx.currentTime);
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
      osc.start();
      osc.stop(ctx.currentTime + 0.1);
    } catch (e) {}
  }

  function add(text, manual){
    if (manual) text = String(text).replace(/\s+/g, ' ').trim();
    if (!text) return;
    var now = Date.now();
    var exists = items.some(function(it){ return it.text === text; });
    if (exists){
      if (manual || text !== lastText) setStatus('Already in the list: ' + (text.length > 60 ? text.slice(0,60) + '\u2026' : text), true);
      lastText = text; lastTime = now; return;
    }
    lastText = text; lastTime = now;
    var entry = { text: text, t: now }; if (manual) entry.m = 1;
    items.unshift(entry);
    save(); render();
    playScanBeep();
    if (navigator.vibrate) { try { navigator.vibrate(60); } catch (e) {} }
    
    // Trigger the giant green checkmark overlay for 400ms
    cam.classList.add('flash'); 
    setTimeout(function(){ cam.classList.remove('flash'); }, 400); 
    
    setStatus('Added: ' + (text.length > 60 ? text.slice(0,60) + '…' : text));

    try {
      if (manual && typeof onManualName === 'function') {
        onManualName(text);
      } else if (!manual && typeof onScan === 'function') {
        onScan(text);
      }
    } catch (e) {
      console.error('Sheet sync error', e);
    }
  }

  function decodeCanvas(){
    var d = ctx.getImageData(0, 0, canvas.width, canvas.height);
    var r = window.jsQR && jsQR(d.data, d.width, d.height, { inversionAttempts: 'dontInvert' });
    return r && r.data ? r.data : null;
  }

  async function tick(){
    if (!running) return;
    if (video.readyState === 2 || video.readyState === 4){
      try {
        var text = null;
        if (detector){
          var res = await detector.detect(video);
          if (res && res.length) text = res[0].rawValue;
        } else {
          var w = video.videoWidth, h = video.videoHeight, s = Math.min(1, 640 / Math.max(w, h));
          canvas.width = Math.round(w * s); canvas.height = Math.round(h * s);
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          text = decodeCanvas();
        }
        if (text) add(text);
      } catch (e) {}
    }
    setTimeout(function(){ requestAnimationFrame(tick); }, 120);
  }

  var track = null, torchOn = false;
  var torchBtn = document.getElementById('torch');
  var flipBtn = document.getElementById('flip');
  var useFrontCamera = false;

  async function start(){
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      setStatus('Camera not available here. Use “Scan a photo” instead.', true); return;
    }
    try {
      let activeStream = null;
      let activeTrack = null;
      let activeCaps = {};

      if (useFrontCamera) {
        activeStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user" },
          audio: false
        });
        activeTrack = activeStream.getVideoTracks()[0];
        await new Promise(function(r){ setTimeout(r, 200); });
        activeCaps = (activeTrack.getCapabilities && activeTrack.getCapabilities()) || {};
      } else {
        if (navigator.mediaDevices.enumerateDevices) {
          try {
            var devices = await navigator.mediaDevices.enumerateDevices();
            var videoDevices = devices.filter(function(d){ return d.kind === 'videoinput'; });
            
            var backCameras = videoDevices.filter(function(d){
              return /back|rear|environment|0|i/.test(d.label);
            });
            var candidates = backCameras.length > 0 ? backCameras : videoDevices;

            for (var i = 0; i < candidates.length; i++) {
              try {
                var testStream = await navigator.mediaDevices.getUserMedia({
                  video: { deviceId: { exact: candidates[i].deviceId } },
                  audio: false
                });
                var testTrack = testStream.getVideoTracks()[0];
                await new Promise(function(r){ setTimeout(r, 200); });
                var testCaps = (testTrack.getCapabilities && testTrack.getCapabilities()) || {};

                if (testCaps.torch) {
                  activeStream = testStream;
                  activeTrack = testTrack;
                  activeCaps = testCaps;
                  break;
                } else {
                  testStream.getTracks().forEach(function(t){ t.stop(); });
                }
              } catch (err) {}
            }
          } catch (err) {}
        }

        if (!activeStream) {
          activeStream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { exact: 'environment' } },
            audio: false
          });
          activeTrack = activeStream.getVideoTracks()[0];
          await new Promise(function(r){ setTimeout(r, 200); });
          activeCaps = (activeTrack.getCapabilities && activeTrack.getCapabilities()) || {};
        }
      }

      stream = activeStream;
      track = activeTrack;
      video.srcObject = stream; 
      await video.play();

      running = true; 
      cam.classList.add('on'); 
      toggleBtn.textContent = 'Stop camera';
      flipBtn.hidden = false;
      setStatus('Scanning…'); 
      tick();

      torchBtn.hidden = !activeCaps.torch;

    } catch (e) {
      setStatus('Live camera is blocked here. Use “Scan a photo” instead.', true);
    }
  }
  
  function stop(){
    running = false;
    torchOn = false;
    torchBtn.hidden = true;
    flipBtn.hidden = true; 
    torchBtn.textContent = 'Flashlight';
    torchBtn.classList.remove('primary');
    if (stream){ stream.getTracks().forEach(function(t){ t.stop(); }); stream = null; }
    track = null;
    video.srcObject = null; 
    cam.classList.remove('on'); 
    toggleBtn.textContent = 'Start camera'; 
    setStatus('');
  }
  
  toggleBtn.onclick = function(){ running ? stop() : start(); };

  flipBtn.onclick = function(){
    useFrontCamera = !useFrontCamera;
    if (running) {
      stop();
      start(); 
    }
  };

  torchBtn.onclick = async function(){
    if (!track) return;
    var nextState = !torchOn;
    try {
      await track.applyConstraints({ advanced: [{ torch: nextState }] });
      
      var settings = track.getSettings ? track.getSettings() : {};
      torchOn = !!settings.torch; 

      torchBtn.textContent = torchOn ? 'Flashlight' : 'Flashlight';
      torchBtn.classList.toggle('primary', torchOn);
    } catch (e) {
      torchOn = false;
      torchBtn.textContent = 'Flashlight';
      torchBtn.classList.remove('primary');
      setStatus('Flashlight is not supported on this active camera lens.', true);
    }
  };

  document.getElementById('pic').onchange = function(ev){
    var f = ev.target.files && ev.target.files[0]; if (!f) return;
    var img = new Image();
    img.onload = function(){
      var s = Math.min(1, 1200 / Math.max(img.width, img.height));
      canvas.width = Math.round(img.width * s); canvas.height = Math.round(img.height * s);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      var text = decodeCanvas();
      URL.revokeObjectURL(img.src);
      if (text){ lastText = ''; add(text); } else setStatus('No QR code found in that photo.', true);
    };
    img.onerror = function(){ setStatus('Could not read that image.', true); };
    img.src = URL.createObjectURL(f); ev.target.value = '';
  };

  document.getElementById('copyAll').onclick = async function(){
    if (!items.length){ setStatus('Nothing to copy yet.', true); return; }
    var txt = items.slice().reverse().map(function(i){ return i.text; }).join('\n');
    try { await navigator.clipboard.writeText(txt); setStatus('Copied ' + items.length + ' items.'); }
    catch (e) {
      var ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); setStatus('Copied ' + items.length + ' items.'); } catch (e2) { setStatus('Copy failed.', true); }
      document.body.removeChild(ta);
    }
  };

  document.getElementById('clear').onclick = function(){
    if (!items.length) return;
    if (confirm('Delete all ' + items.length + ' scanned codes?')){ items = []; save(); render(); setStatus('List cleared.'); }
  };

  var manualEl = document.getElementById('manual');
  function addManual(){
    if (!manualEl.value.trim()){ setStatus('Type a name first.', true); manualEl.focus(); return; }
    var before = items.length;
    add(manualEl.value, true);
    if (items.length > before) manualEl.value = '';
    manualEl.focus();
  }
  document.getElementById('addManual').onclick = addManual;
  manualEl.addEventListener('keydown', function(e){ if (e.key === 'Enter'){ e.preventDefault(); addManual(); } });

  load(); render();
})();
</script>

<script>
try{if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){navigator.serviceWorker.register('sw.js');}}catch(e){}
</script>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbwAE_xO0K_z96yolnu9udi0BytNq_4yRn3z-sUgdmtS1QjtLH21Hw5TwbUJERRrpINSYw/exec';

function getQueue() {
  try { return JSON.parse(localStorage.getItem('attQueue') || '[]'); }
  catch { return []; }
}
function saveQueue(q) { localStorage.setItem('attQueue', JSON.stringify(q)); }

let isSyncing = false; 

async function sendToSheet(item) {
  const res = await fetch(API_URL + '?' + new URLSearchParams(item));
  const text = await res.text(); 
  try {
    return JSON.parse(text); 
  } catch (e) {
    console.error('Sheet returned invalid JSON', text);
    return { ok: false, error: 'Server Error' };
  }
}

async function submit(item) {
  try {
    return await sendToSheet(item);
  } catch (e) {
    const q = getQueue();
    q.push(item);
    saveQueue(q);
    return { ok: false, queued: true };
  }
}

async function flushQueue() {
  if (isSyncing) return; 
  
  let q = getQueue();
  if (!q.length) return;
  
  isSyncing = true; 

  try {
    while (q.length > 0) {
      const item = q[0]; 
      try {
        const res = await sendToSheet(item);
        const val = item.code || item.name;

        if (res && res.ok && (res.already === true || res.already === 'true')) {
          updateItemStatus(val, '✔ (Already)', 'already');
        } else if (res && res.ok) {
          updateItemStatus(val, '✔', 'ok');
        } else {
          updateItemStatus(val, '✖ (' + (res.error || 'Failed') + ')', 'err');
        }

        q = getQueue(); 
        q.shift();       
        saveQueue(q);    

      } catch (e) {
        break; 
      }
    }
  } finally {
    isSyncing = false; 
  }
}

setInterval(flushQueue, 5000);
window.addEventListener('online', flushQueue);
window.addEventListener('load', flushQueue);

async function onScan(code) {
  var session = document.getElementById('sessionSelect').value;
  updateItemStatus(code, '⌛', 'syncing');
  const result = await submit({ code: code, session: session });
  showResult(code, result);
}

async function onManualName(name) {
  var session = document.getElementById('sessionSelect').value;
  updateItemStatus(name, '⌛', 'syncing');
  const result = await submit({ name: name, session: session });
  showResult(name, result);
}

function showResult(text, r) {
  if (r.queued) {
    updateItemStatus(text, '☁ (Offline)', 'syncing');
  } else if (r.ok && (r.already === true || r.already === 'true')) {
    updateItemStatus(text, '✔ (Already)', 'already');
  } else if (r.ok) {
    updateItemStatus(text, '✔', 'ok');
  } else {
    updateItemStatus(text, '✖ (' + (r.error || 'Failed') + ')', 'err');
  }
}

function updateItemStatus(text, badgeText, statusClass) {
  if (typeof window.setItemStatus === 'function') {
    window.setItemStatus(text, badgeText, statusClass);
  }
}
</script>

</body>
</html>
