<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>QR List Scanner</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0f2d59">
  <link rel="icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #eef2f7;
      --surface: rgba(255, 255, 255, 0.72);
      --surface-solid: #ffffff;
      --input-bg: rgba(255, 255, 255, 0.65);
      --ink: #0f172a;
      --muted: #5c6b7e;
      --line: rgba(148, 163, 184, 0.28);
      --accent: #dfa437;
      --accent-2: #f59e0b;
      --accent-ink: #072b56;
      --danger: #ef4444;
      --glass-inset: rgba(255, 255, 255, 0.75);
      --shadow-soft: 0 10px 30px -5px rgba(15, 45, 89, 0.10), 0 4px 12px -2px rgba(15, 45, 89, 0.05);
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark){
      :root:not([data-theme="light"]){
        --bg: #020b1c;
        --surface: rgba(12, 29, 58, 0.65);
        --surface-solid: #0a1d3b;
        --input-bg: rgba(2, 15, 36, 0.55);
        --ink: #f8fafc;
        --muted: #94a8c4;
        --line: rgba(148, 163, 184, 0.18);
        --accent: #dfa437;
        --accent-2: #f59e0b;
        --accent-ink: #072b56;
        --danger: #ff6b6b;
        --glass-inset: rgba(255, 255, 255, 0.12);
        --shadow-soft: 0 12px 36px -6px rgba(0, 0, 0, 0.48), 0 4px 12px -2px rgba(0, 0, 0, 0.32);
        color-scheme: dark;
      }
    }

    * { box-sizing: border-box; }
    html { scroll-padding-top: env(safe-area-inset-top, 0px); }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Cairo', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      line-height: 1.45;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Ambient Liquid Glow */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 15% 10%, rgba(223, 164, 55, 0.16) 0%, transparent 45%),
        radial-gradient(circle at 85% 25%, rgba(59, 130, 246, 0.18) 0%, transparent 48%),
        radial-gradient(circle at 50% 90%, rgba(16, 185, 129, 0.10) 0%, transparent 50%);
      pointer-events: none;
      z-index: -1;
    }

    main { max-width: 540px; margin: 0 auto; padding: 16px 14px 40px; }

    .header-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      margin-bottom: 14px;
      background: var(--surface);
      backdrop-filter: blur(22px) saturate(160%);
      -webkit-backdrop-filter: blur(22px) saturate(160%);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: var(--shadow-soft), inset 0 1px 0 var(--glass-inset);
    }
    h1 { font-size: 1.2rem; font-weight: 900; margin: 0; display: flex; align-items: center; gap: 8px; }
    .ver-pill {
      font-weight: 800;
      font-size: 0.72rem;
      padding: 2px 9px;
      border-radius: 99px;
      background: rgba(223, 164, 55, 0.18);
      color: var(--accent);
      border: 1px solid rgba(223, 164, 55, 0.35);
    }

    .glass-card {
      background: var(--surface);
      backdrop-filter: blur(22px) saturate(160%);
      -webkit-backdrop-filter: blur(22px) saturate(160%);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 14px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-soft), inset 0 1px 0 var(--glass-inset);
    }

    .cam {
      position: relative;
      background: #020617;
      border-radius: 18px;
      overflow: hidden;
      aspect-ratio: 1/1;
      border: 1px solid var(--line);
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.28);
    }
    .cam video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .cam .hint {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      text-align: center; color: #cbd5e1; padding: 24px; font-size: .95rem; font-weight: 700;
    }
    .cam .frame {
      position: absolute; inset: 18%;
      border: 3px solid var(--accent);
      border-radius: 16px;
      box-shadow: 0 0 0 9999px rgba(2, 6, 23, 0.25), inset 0 0 16px rgba(223, 164, 55, 0.35);
      pointer-events: none;
      display: none;
    }
    .cam.on .frame { display: block; }
    .cam.on .hint { display: none; }

    /* Giant popping checkmark for success */
    .cam.flash::after {
      content: '✔';
      position: absolute; inset: 0;
      background: rgba(16, 185, 129, 0.85);
      backdrop-filter: blur(4px);
      color: white; font-size: 8rem;
      display: flex; align-items: center; justify-content: center;
      z-index: 10; animation: pop 0.2s ease-out;
    }
    /* Giant red X for already scanned */
    .cam.flash-err::after, .cam.hold-err::after {
      content: '✖';
      position: absolute; inset: 0;
      background: rgba(239, 68, 68, 0.85);
      backdrop-filter: blur(4px);
      color: white; font-size: 8rem;
      display: flex; align-items: center; justify-content: center;
      z-index: 10; animation: pop 0.2s ease-out;
    }
    @keyframes pop {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* Liquid Glass Session Overlay */
    .session-overlay {
      position: absolute;
      top: 14px; left: 50%; transform: translateX(-50%);
      background: rgba(7, 25, 56, 0.72);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.22);
      color: #fde047;
      padding: 6px 14px;
      border-radius: 99px;
      font-weight: 900;
      font-size: 1.35rem;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45), inset 0 1px 1px rgba(255, 255, 255, 0.25);
      z-index: 5;
      pointer-events: none;
      display: none;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
    }
    .cam.on .session-overlay { display: flex; }
    .overlay-badge {
      background: linear-gradient(135deg, #fde047, #dfa437);
      color: #072b56;
      border-radius: 99px;
      padding: 1px 11px;
      font-size: 1.15rem;
      line-height: 1.3;
      box-shadow: 0 2px 8px rgba(223, 164, 55, 0.4);
    }

    .row { display: flex; gap: 8px; margin: 12px 0 0; flex-wrap: wrap; }

    select, input[type=text], button {
      font: inherit;
      border: 1px solid var(--line);
      background: var(--input-bg);
      color: var(--ink);
      padding: 10px 14px;
      border-radius: 14px;
      min-height: 44px;
      transition: all 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    }
    select { flex: 1; font-weight: 800; cursor: pointer; }
    input[type=text] { flex: 1; min-width: 0; font-weight: 700; }
    select:focus, input[type=text]:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(223, 164, 55, 0.22);
      background: var(--surface-solid);
    }

    button { cursor: pointer; font-weight: 800; }
    button:active { transform: scale(0.96); }
    button.primary {
      background: linear-gradient(135deg, #f5c04e 0%, #dfa437 60%, #c88a1e 100%);
      color: var(--accent-ink);
      border: 1px solid rgba(255, 255, 255, 0.45);
      box-shadow: 0 6px 18px rgba(223, 164, 55, 0.32), inset 0 1px 1px rgba(255, 255, 255, 0.55);
      flex: 1;
    }

    /* Forgot Card Toggle */
    .forgot-btn {
      display: flex; align-items: center; justify-content: center;
      font-size: 0.82rem; font-weight: 800; cursor: pointer;
      background: var(--input-bg);
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 0 12px;
      transition: all 0.22s ease;
      white-space: nowrap;
      user-select: none;
    }
    input#forgotCard:checked + .forgot-btn {
      background: linear-gradient(135deg, #fde047, #f59e0b);
      color: #072b56;
      border-color: rgba(255, 255, 255, 0.5);
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.35);
    }

    .status { font-size: .88rem; font-weight: 700; color: var(--muted); min-height: 1.3em; margin: 10px 2px 0; }
    .status.err { color: var(--danger); }

    .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .head h2 { font-size: 1.05rem; font-weight: 900; margin: 0; }
    .count {
      font-size: .85rem; font-weight: 900;
      padding: 2px 10px; border-radius: 99px;
      background: rgba(223, 164, 55, 0.16); color: var(--accent);
      border: 1px solid rgba(223, 164, 55, 0.3);
    }

    ul { list-style: none; margin: 12px 0 0; padding: 0; }
    li {
      background: var(--input-bg);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 10px 12px;
      margin-bottom: 8px;
      display: flex; gap: 10px; align-items: center;
      transition: transform 0.2s ease;
    }
    li .txt { flex: 1; min-width: 0; overflow-wrap: anywhere; font-weight: 700; }
    li .time { display: block; font-size: .75rem; font-weight: 600; color: var(--muted); margin-top: 2px; }
    li a { color: var(--accent); }
    li button {
      min-height: 34px; padding: 5px 11px; font-size: .8rem;
      border-radius: 10px;
      background: rgba(239, 68, 68, 0.12);
      color: var(--danger);
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    .empty { color: var(--muted); padding: 14px 0; text-align: center; font-weight: 700; justify-content: center; }

    .sync-status { margin-left: 6px; font-weight: 800; font-size: 0.95rem; }
    .sync-status.ok { color: #10b981; }
    .sync-status.already { color: #f59e0b; }
    .sync-status.err { color: var(--danger); }
    .sync-status.syncing { color: var(--muted); font-size: 0.8rem; }
  </style>
</head>
<body>
<main>
  <div class="header-card">
    <h1>📷 QR List Scanner</h1>
    <span class="ver-pill">v22</span>
  </div>

  <div class="glass-card">
    <div class="cam" id="cam">
      <div class="session-overlay" id="sessionOverlay">
        <span id="overlaySessionText"></span>
        <span class="overlay-badge" id="overlayCount">0</span>
      </div>
      <video id="video" playsinline muted></video>
      <div class="frame"></div>
      <div class="hint">Tap “Start camera”, then point it at a QR code.</div>
    </div>

    <div class="row">
      <select id="sessionSelect">
        <option value="قداس">قداس</option>
        <option value="ألحان">ألحان</option>
        <option value="عشية">عشية</option>
      </select>
    </div>

    <div class="row">
      <button class="primary" id="toggle">Start camera</button>
      <button id="flip" hidden>Flip</button>
      <button id="torch" hidden>Flashlight</button>
    </div>

    <p class="status" id="status" role="status"></p>

    <div class="row" style="align-items:stretch;">
      <input type="text" id="manual" dir="auto" placeholder="Type a name" autocomplete="off" enterkeyhint="done" aria-label="Type a name">
      <input type="checkbox" id="forgotCard" hidden>
      <label for="forgotCard" class="forgot-btn">نسي الكارت؟</label>
      <button id="addManual">Add</button>
    </div>
  </div>

  <div class="glass-card">
    <div class="head">
      <h2>Scanned codes</h2>
      <span class="count" id="count">0</span>
    </div>
    <div class="row" style="margin-top:0;">
      <button id="copyAll" style="flex:1;">Copy all</button>
      <button id="clear" style="flex:1; background:rgba(239,68,68,0.12); color:var(--danger); border-color:rgba(239,68,68,0.3);">Clear list</button>
    </div>
    <ul id="list"></ul>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

<script>
(function(){
  var KEY = 'qr-list-v1';
  var items = [];
  var video = document.getElementById('video');
  var cam = document.getElementById('cam');
  var statusEl = document.getElementById('status');
  var listEl = document.getElementById('list');
  var countEl = document.getElementById('count');
  var overlayCountEl = document.getElementById('overlayCount');
  var toggleBtn = document.getElementById('toggle');
  
  var stream = null, running = false, detector = null;
  var canvas = document.createElement('canvas');
  var ctx = canvas.getContext('2d', { willReadFrequently: true });
  var sessionSelect = document.getElementById('sessionSelect');
  
  // Timers and Memory
  var codeGoneTimer = null;
  var lastAddedText = '';
  var lastAddedTime = 0;
  var lastErrorText = ''; 

  function updateOverlay() {
    document.getElementById('overlaySessionText').textContent = sessionSelect.options[sessionSelect.selectedIndex].text;
  }
  sessionSelect.addEventListener('change', updateOverlay);
  updateOverlay();

  try { if ('BarcodeDetector' in window) detector = new BarcodeDetector({ formats: ['qr_code'] }); } catch (e) { detector = null; }

  function load(){ try { items = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { items = []; } if (!Array.isArray(items)) items = []; }
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(items)); } catch (e) {} }
  function cleanupOldSynced() {
    var cutoff = Date.now() - (24 * 60 * 60 * 1000); // 24 hours
    var before = items.length;
    items = items.filter(function(it) {
      var isSynced = (it.bc === 'ok' || it.bc === 'already');
      return !(isSynced && it.t && it.t < cutoff);
    });
    if (items.length !== before) {
      save();
      render();
    }
  }
  function setStatus(msg, err){ statusEl.textContent = msg || ''; statusEl.className = 'status' + (err ? ' err' : ''); }
  function isUrl(s){ return /^https?:\/\/\S+$/i.test(s); }

  function render(){
    countEl.textContent = items.length;
    overlayCountEl.textContent = items.length;
    listEl.innerHTML = '';
    if (!items.length){
      var p = document.createElement('li');
      p.className = 'empty'; p.style.border = '0'; p.style.background = 'none'; p.style.padding = '14px 0';
      p.textContent = 'Nothing yet. Scanned codes will appear here.';
      listEl.appendChild(p); return;
    }
    items.forEach(function(it, i){
      var li = document.createElement('li');
      var box = document.createElement('div'); box.className = 'txt';
      if (isUrl(it.text)){
        var a = document.createElement('a'); a.href = it.text; a.target = '_blank'; a.rel = 'noopener noreferrer'; a.textContent = it.text; box.appendChild(a);
      } else { box.appendChild(document.createTextNode(it.text)); }
      if (it.b){
        var badge = document.createElement('span');
        badge.className = 'sync-status ' + (it.bc || '');
        badge.textContent = ' ' + it.b;
        box.appendChild(badge);
      }
      var t = document.createElement('span'); t.className = 'time'; t.textContent = new Date(it.t).toLocaleString() + (it.m ? ' (typed)' : ''); box.appendChild(t);
      var del = document.createElement('button'); del.textContent = 'Delete'; del.setAttribute('aria-label','Delete this entry');
      del.onclick = function(){ items.splice(i,1); save(); render(); };
      li.appendChild(box); li.appendChild(del); listEl.appendChild(li);
    });
  }
  
  window.setItemStatus = function(text, badgeText, cls){
    for (var i = 0; i < items.length; i++){
      if (items[i].text === text){ items[i].b = badgeText; items[i].bc = cls || ''; break; }
    }
    save(); render();
  };

  function playScanBeep(isErr) {
    try {
      var AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return;
      var ctx = new AudioContext();
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      
      osc.type = isErr ? 'sawtooth' : 'sine';
      osc.frequency.setValueAtTime(isErr ? 300 : 1500, ctx.currentTime);
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + (isErr ? 0.3 : 0.1));
      osc.start();
      osc.stop(ctx.currentTime + (isErr ? 0.3 : 0.1));
    } catch (e) {}
  }

  function add(text, manual){
    if (manual) text = String(text).replace(/\s+/g, ' ').trim();
    if (!text) return;
    cleanupOldSynced();
    var now = Date.now();
    var isForgot = document.getElementById('forgotCard').checked;

    var exists = items.some(function(it){ return it.text === text; });
    if (exists){
      if (manual) {
        setStatus('Already in the list: ' + text, true);
        cam.classList.remove('hold-err');
        cam.classList.remove('flash-err');
        void cam.offsetWidth; // Reflow
        cam.classList.add('flash-err');
        setTimeout(function(){ cam.classList.remove('flash-err'); }, 400);
        playScanBeep(true);
      } else {
        
        // ---- THE 5-SECOND SHIELD ----
        if (text === lastAddedText && (now - lastAddedTime < 5000)) {
           lastErrorText = text;
           return; 
        }

        cam.classList.add('hold-err');
        if (text !== lastErrorText) {
          setStatus('Already in the list: ' + (text.length > 60 ? text.slice(0,60) + '\u2026' : text), true);
          playScanBeep(true);
          if (navigator.vibrate) { try { navigator.vibrate([100, 50, 100]); } catch (e) {} }
        }
      }
      lastErrorText = text;
      return;
    }
    
    // ---- SUCCESSFUL NEW SCAN ----
    lastAddedText = text; 
    lastAddedTime = now;
    lastErrorText = text;
    
    var entry = { text: text, t: now }; if (manual) entry.m = 1;
    items.unshift(entry);
    save(); render();
    playScanBeep(false);
    if (navigator.vibrate) { try { navigator.vibrate(60); } catch (e) {} }
    
    cam.classList.remove('hold-err');
    cam.classList.add('flash'); 
    setTimeout(function(){ cam.classList.remove('flash'); }, 400); 
    
    setStatus('Added: ' + (text.length > 60 ? text.slice(0,60) + '…' : text));

    try {
      if (manual && typeof onManualName === 'function') {
        onManualName(text, isForgot);
      } else if (!manual && typeof onScan === 'function') {
        onScan(text, isForgot);
      }
    } catch (e) {
      console.error('Sheet sync error', e);
    }
  }

  function decodeCanvas(){
    var d = ctx.getImageData(0, 0, canvas.width, canvas.height);
    var r = window.jsQR && jsQR(d.data, d.width, d.height, { inversionAttempts: 'dontInvert' });
    return r && r.data ? r.data : null;
  }

  async function tick(){
    if (!running) return;
    if (video.readyState === 2 || video.readyState === 4){
      try {
        var text = null;
        if (detector){
          var res = await detector.detect(video);
          if (res && res.length) text = res[0].rawValue;
        } else {
          var w = video.videoWidth, h = video.videoHeight, s = Math.min(1, 640 / Math.max(w, h));
          canvas.width = Math.round(w * s); canvas.height = Math.round(h * s);
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          text = decodeCanvas();
        }
        
        if (text) {
          clearTimeout(codeGoneTimer);
          add(text);
          
          codeGoneTimer = setTimeout(function(){
            cam.classList.remove('hold-err');
            lastErrorText = ''; 
          }, 600);
        }

      } catch (e) {}
    }
    setTimeout(function(){ requestAnimationFrame(tick); }, 120);
  }

  var track = null, torchOn = false;
  var torchBtn = document.getElementById('torch');
  var flipBtn = document.getElementById('flip');
  var useFrontCamera = false;

  async function start(){
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      setStatus('Camera not available.', true); return;
    }
    try {
      let activeStream = null;
      let activeTrack = null;
      let activeCaps = {};

      if (useFrontCamera) {
        activeStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user" },
          audio: false
        });
        activeTrack = activeStream.getVideoTracks()[0];
        await new Promise(function(r){ setTimeout(r, 200); });
        activeCaps = (activeTrack.getCapabilities && activeTrack.getCapabilities()) || {};
      } else {
        if (navigator.mediaDevices.enumerateDevices) {
          try {
            var devices = await navigator.mediaDevices.enumerateDevices();
            var videoDevices = devices.filter(function(d){ return d.kind === 'videoinput'; });
            
            var backCameras = videoDevices.filter(function(d){
              return /back|rear|environment|0|i/.test(d.label);
            });
            var candidates = backCameras.length > 0 ? backCameras : videoDevices;

            for (var i = 0; i < candidates.length; i++) {
              try {
                var testStream = await navigator.mediaDevices.getUserMedia({
                  video: { deviceId: { exact: candidates[i].deviceId } },
                  audio: false
                });
                var testTrack = testStream.getVideoTracks()[0];
                await new Promise(function(r){ setTimeout(r, 200); });
                var testCaps = (testTrack.getCapabilities && testTrack.getCapabilities()) || {};

                if (testCaps.torch) {
                  activeStream = testStream;
                  activeTrack = testTrack;
                  activeCaps = testCaps;
                  break;
                } else {
                  testStream.getTracks().forEach(function(t){ t.stop(); });
                }
              } catch (err) {}
            }
          } catch (err) {}
        }

        if (!activeStream) {
          activeStream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { exact: 'environment' } },
            audio: false
          });
          activeTrack = activeStream.getVideoTracks()[0];
          await new Promise(function(r){ setTimeout(r, 200); });
          activeCaps = (activeTrack.getCapabilities && activeTrack.getCapabilities()) || {};
        }
      }

      stream = activeStream;
      track = activeTrack;
      video.srcObject = stream; 
      await video.play();

      running = true; 
      cam.classList.add('on'); 
      toggleBtn.textContent = 'Stop camera';
      flipBtn.hidden = false;
      setStatus('Scanning…'); 
      tick();

      torchBtn.hidden = !activeCaps.torch;

    } catch (e) {
      setStatus('Live camera is blocked here.', true);
    }
  }
  
  function stop(){
    running = false;
    torchOn = false;
    torchBtn.hidden = true;
    flipBtn.hidden = true; 
    torchBtn.textContent = 'Flashlight';
    torchBtn.classList.remove('primary');
    if (stream){ stream.getTracks().forEach(function(t){ t.stop(); }); stream = null; }
    track = null;
    video.srcObject = null; 
    cam.classList.remove('on'); 
    toggleBtn.textContent = 'Start camera'; 
    setStatus('');
  }
  
  toggleBtn.onclick = function(){ running ? stop() : start(); };

  flipBtn.onclick = function(){
    useFrontCamera = !useFrontCamera;
    if (running) {
      stop();
      start(); 
    }
  };

  torchBtn.onclick = async function(){
    if (!track) return;
    var nextState = !torchOn;
    try {
      await track.applyConstraints({ advanced: [{ torch: nextState }] });
      
      var settings = track.getSettings ? track.getSettings() : {};
      torchOn = !!settings.torch; 

      torchBtn.textContent = torchOn ? 'Flashlight' : 'Flashlight';
      torchBtn.classList.toggle('primary', torchOn);
    } catch (e) {
      torchOn = false;
      torchBtn.textContent = 'Flashlight';
      torchBtn.classList.remove('primary');
      setStatus('Flashlight is not supported on this active camera lens.', true);
    }
  };

  document.getElementById('copyAll').onclick = async function(){
    if (!items.length){ setStatus('Nothing to copy yet.', true); return; }
    var txt = items.slice().reverse().map(function(i){ return i.text; }).join('\n');
    try { await navigator.clipboard.writeText(txt); setStatus('Copied ' + items.length + ' items.'); }
    catch (e) {
      var ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); setStatus('Copied ' + items.length + ' items.'); } catch (e2) { setStatus('Copy failed.', true); }
      document.body.removeChild(ta);
    }
  };

  document.getElementById('clear').onclick = function(){
    if (!items.length) return;
    if (confirm('Delete all ' + items.length + ' scanned codes?')){ items = []; save(); render(); setStatus('List cleared.'); }
  };

  var manualEl = document.getElementById('manual');
  function addManual(){
    if (!manualEl.value.trim()){ setStatus('Type a name first.', true); manualEl.focus(); return; }
    var before = items.length;
    add(manualEl.value, true);
    if (items.length > before) {
        manualEl.value = '';
    }
    manualEl.focus();
  }
  document.getElementById('addManual').onclick = addManual;
  manualEl.addEventListener('keydown', function(e){ if (e.key === 'Enter'){ e.preventDefault(); addManual(); } });

  document.addEventListener('visibilitychange', function(){
    if (!document.hidden) cleanupOldSynced();
  });

  load(); cleanupOldSynced(); render();
})();
</script>

<script>
try{if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){navigator.serviceWorker.register('sw.js');}}catch(e){}
</script>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbwAE_xO0K_z96yolnu9udi0BytNq_4yRn3z-sUgdmtS1QjtLH21Hw5TwbUJERRrpINSYw/exec';

function getQueue() {
  try { return JSON.parse(localStorage.getItem('attQueue') || '[]'); }
  catch { return []; }
}
function saveQueue(q) { localStorage.setItem('attQueue', JSON.stringify(q)); }

let isSyncing = false; 

async function sendToSheet(item) {
  const res = await fetch(API_URL + '?' + new URLSearchParams(item));
  const text = await res.text(); 
  try {
    return JSON.parse(text); 
  } catch (e) {
    console.error('Sheet returned invalid JSON', text);
    return { ok: false, error: 'Server Error' };
  }
}

async function submit(item) {
  try {
    return await sendToSheet(item);
  } catch (e) {
    const q = getQueue();
    q.push(item);
    saveQueue(q);
    return { ok: false, queued: true };
  }
}

async function flushQueue() {
  if (isSyncing) return; 
  
  let q = getQueue();
  if (!q.length) return;
  
  isSyncing = true; 

  try {
    while (q.length > 0) {
      const item = q[0]; 
      try {
        const res = await sendToSheet(item);
        const val = item.code || item.name;

        if (res && res.ok && (res.already === true || res.already === 'true')) {
          updateItemStatus(val, '✔ (Already)', 'already');
        } else if (res && res.ok) {
          updateItemStatus(val, '✔', 'ok');
        } else {
          updateItemStatus(val, '✖ (' + (res.error || 'Failed') + ')', 'err');
        }

        q = getQueue(); 
        q.shift();       
        saveQueue(q);    

      } catch (e) {
        break; 
      }
    }
  } finally {
    isSyncing = false; 
  }
}

setInterval(flushQueue, 5000);
window.addEventListener('online', flushQueue);
window.addEventListener('load', flushQueue);

async function onScan(code, isForgot) {
  var session = document.getElementById('sessionSelect').value;
  updateItemStatus(code, '⌛', 'syncing');
  const result = await submit({ code: code, session: session, forgotCard: false });
  showResult(code, result);
}

async function onManualName(name, isForgot) {
  var session = document.getElementById('sessionSelect').value;
  updateItemStatus(name, '⌛', 'syncing');
  const result = await submit({ name: name, session: session, forgotCard: isForgot });
  showResult(name, result);
}

function showResult(text, r) {
  if (r.queued) {
    updateItemStatus(text, '☁ (Offline)', 'syncing');
  } else if (r.ok && (r.already === true || r.already === 'true')) {
    updateItemStatus(text, '✔ (Already)', 'already');
    var cam = document.getElementById('cam');
    if (cam) {
      cam.classList.remove('flash-err');
      void cam.offsetWidth;
      cam.classList.add('flash-err');
      setTimeout(function(){ cam.classList.remove('flash-err'); }, 400);
    }
  } else if (r.ok) {
    updateItemStatus(text, '✔', 'ok');
  } else {
    updateItemStatus(text, '✖ (' + (r.error || 'Failed') + ')', 'err');
  }
}

function updateItemStatus(text, badgeText, statusClass) {
  if (typeof window.setItemStatus === 'function') {
    window.setItemStatus(text, badgeText, statusClass);
  }
}
</script>
